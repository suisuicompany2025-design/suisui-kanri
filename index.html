const BS_KIND={現金:"資産",普通預金:"資産",売掛金:"資産",商品:"資産",事業主貸:"資産",買掛金:"負債",未払金:"負債",事業主借:"負債",元入金:"資本"};
function acctKind(a){if(BS_KIND[a])return BS_KIND[a];if(ACCTS.収入.includes(a)||a==="期末商品棚卸高")return"収益";return"費用";}
function productCost(name){const p=state.products.find(x=>baseName(x.name)===name&&x.cost!=null);if(p)return+p.cost;const ins=(state.stockMoves||[]).filter(m=>m.product===name&&+m.qty>0&&m.unitCost!=null);if(ins.length)return+ins[ins.length-1].unitCost;return/BIB/i.test(name)?1500:0;}

function dataYears(){const ys=new Set();state.txns.forEach(t=>{if(t.date)ys.add(t.date.slice(0,4));});state.docs.forEach(d=>{if(d.issueDate)ys.add(d.issueDate.slice(0,4));});const od=(state.settings||{}).openDate;if(od)ys.add(od.slice(0,4));if(!ys.size)ys.add(String(new Date().getFullYear()));return[...ys].filter(y=>/^\d{4}$/.test(y)).sort();}
function journal(y){

    if(isIssued(d))push(d.issueDate,"売掛金","売上高",calc(d).total,`${d.number} ${clientName(d.clientId)}${docSubject(d)?"・"+docSubject(d):""}`,d.id,"doc");
    else{const a=expAcctOfDoc(d);push(d.issueDate,a,a==="仕入高"?"買掛金":"未払金",docAmt(d),`${d.number} ${partyName(d)}${docSubject(d)?"・"+docSubject(d):""}`,d.id,"doc");}});
  state.txns.forEach(t=>{if(!t.date||t.date.slice(0,4)!==y)return;const d=t.docId?state.docs.find(x=>x.id===t.docId):null;const acct=payAcct(t),cat=(t.category||"").trim(),memo=t.memo||cat||t.type,amt=Math.round(+t.amount||0);

const journalAll=()=>dataYears().flatMap(journal);
function ledgerBalances(entries){const b={};entries.forEach(e=>{b[e.dr]=(b[e.dr]||0)+e.amt;b[e.cr]=(b[e.cr]||0)-e.amt;});return b;}
/* 損益：その年の仕訳から収益・費用を集計 */
function plOf(y){const cur=journal(y),b=ledgerBalances(cur),rev={},exp={};Object.keys(b).forEach(a=>{const k=acctKind(a);if(k==="収益")rev[a]=-b[a];else if(k==="費用")exp[a]=b[a];});

/* 貸借対照表：年をまたぐときは、事業主貸・借と利益を元入金に振り替える（個人事業の翌期首処理） */
function bsOf(y){
  const all=journalAll(),pre=all.filter(e=>e.date<y+"-01-01"),upto=all.filter(e=>e.date<=y+"-12-31");

  const mk=(b,own)=>{const o={assets:{},liabs:{}};Object.keys(b).forEach(a=>{const k=acctKind(a);if(k==="資産"&&a!=="事業主貸"&&b[a])o.assets[a]=b[a];if(k==="負債"&&a!=="事業主借"&&b[a])o.liabs[a]=-b[a];});o.cap=cap;o.owner=own;return o;};

const ACCT_ORDER=["現金","普通預金","売掛金","商品","事業主貸","買掛金","未払金","事業主借","元入金"];

let acctYear="",acctTab="fs",acctLedger="",acctQ="";
const SRC_JA={txn:["お金","p-teal"],doc:["書類","p-kraft"],auto:["自動","p-gray"],open:["開業","p-gray"],close:["決算整理","p-warn"]};

let onOk=null;
function openModal(title,body,ok){onOk=ok;
  const o=document.createElement("div");o.className="overlay";o.id="ov";

  document.body.appendChild(o);o.addEventListener("mousedown",e=>{if(e.target===o)closeModal();});

}
window.closeModal=()=>{const o=$("#ov");if(o)o.remove();};
function infoModal(title,html){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><h3>${title}</h3>${html}<div class="modal-foot"><span></span><button class="btn ghost" onclick="this.closest('.overlay').remove()">閉じる</button></div></div>`;document.body.appendChild(o);o.addEventListener("mousedown",e=>{if(e.target===o)o.remove();});}
function toast(msg,action){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");const s=document.createElement("span");s.textContent=msg;t.appendChild(s);if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{t.remove();action.fn();};t.appendChild(b);}document.body.appendChild(t);requestAnimationFrame(()=>{t.style.opacity="1";});setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),250);},action?6000:2400);}
function confirmModal(msg,onYes,okLabel,danger){okLabel=okLabel||"削除する";const red=danger!==false;const o=document.createElement("div");o.className="overlay";o.innerHTML='<div class="modal" style="max-width:400px"><p style="margin:0 0 20px;font-size:15px;line-height:1.6">'+esc(msg)+'</p><div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn ghost" id="cno">キャンセル</button><button class="btn" id="cyes"'+(red?' style=\'background:var(--expense)\'':'')+'>'+esc(okLabel)+'</button></div></div>';document.body.appendChild(o);o.addEventListener("mousedown",e=>{if(e.target===o)o.remove();});o.querySelector("#cno").onclick=()=>o.remove();o.querySelector("#cyes").onclick=()=>{o.remove();onYes();};}

$("#backup").onclick=()=>{const json=JSON.stringify(state);const o=document.createElement("div");o.className="overlay";o.innerHTML='<div class="modal"><h3>データのバックアップ</h3><p style="margin-top:0;font-size:13px;color:var(--text2)">下の内容をすべてコピーして、メモ帳などに保存してください（復元時に貼り付けます）。</p><textarea id="bkp" rows="8" readonly style="font-size:11px"></textarea><div class="modal-foot"><span></span><span><button class="btn ghost" id="bkc">閉じる</button> <button class="btn" id="bkcopy">コピー</button></span></div></div>';document.body.appendChild(o);const ta=o.querySelector("#bkp");ta.value=json;o.addEventListener("mousedown",e=>{if(e.target===o)o.remove();});o.querySelector("#bkc").onclick=()=>o.remove();o.querySelector("#bkcopy").onclick=async()=>{ta.select();let ok=false;try{await navigator.clipboard.writeText(json);ok=true;}catch(e){try{ok=document.execCommand("copy");}catch(_){}}toast(ok?"コピーしました":"手動でコピーしてください");};};
$("#restore").onclick=()=>{const o=document.createElement("div");o.className="overlay";o.innerHTML='<div class="modal"><h3>データを復元</h3><p style="margin-top:0;font-size:13px;color:var(--text2)">バックアップしたデータ（JSON）を貼り付けてください。現在のデータは置き換わります。</p><textarea id="rst" rows="8" placeholder="ここに貼り付け" style="font-size:11px"></textarea><div class="modal-foot"><span></span><span><button class="btn ghost" id="rstc">キャンセル</button> <button class="btn" id="rstok">復元する</button></span></div></div>';document.body.appendChild(o);o.addEventListener("mousedown",e=>{if(e.target===o)o.remove();});o.querySelector("#rstc").onclick=()=>o.remove();o.querySelector("#rstok").onclick=()=>{const v=o.querySelector("#rst").value.trim();if(!v)return;let obj;try{obj=JSON.parse(v);}catch(e){toast("データの形式が正しくありません");return;}/* 無関係なJSONを貼ると全データが消えてしまうため、水翠のバックアップかどうか確かめてから置き換える */const isArr=k=>Array.isArray(obj&&obj[k]);if(!obj||typeof obj!=="object"||Array.isArray(obj)||!(isArr("docs")||isArr("txns")||isArr("clients")||isArr("todos"))){toast("水翠のバックアップではないようです（書類・お金・取引先の記録が見つかりません）");return;}const n=k=>Array.isArray(obj[k])?obj[k].length:0;confirmModal(`いまのデータ：書類${state.docs.length}件・お金${state.txns.length}件・取引先${state.clients.length}件　→　復元するデータ：書類${n("docs")}件・お金${n("txns")}件・取引先${n("clients")}件。いまのデータは置き換わります。よろしいですか？`,()=>{state=Object.assign(DEF(),obj);save();o.remove();render();toast("復元しました");},"復元する",true);};};
