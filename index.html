<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>水翠 経営管理ツール</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#faf9f7}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head><body>
<title>水翠 経営管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F5F4; --surface:#FFFFFF; --surface2:#F6F8F8; --rail:#E9EEEE;
  --navy:#1B2A4A; --ink:#1B2A4A; --teal:#2A7F8E; --teal-d:#1F6673; --teal-bg:#E3F0F1; --kraft:#A8844F; --kraft-bg:#F3ECE0;
  --text:#1B2A4A; --text2:#4F5E73; --muted:#8593A3; --border:#DDE5E5; --border2:#C9D4D5;
  --income:#2F7D5B; --income-bg:#E2F1E9; --expense:#B5523B; --expense-bg:#F7E6E0;
  --warn:#A8741A; --warn-bg:#F6ECD6;
  --shadow:0 1px 2px rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.06);
  --lift:0 12px 40px rgba(27,42,74,.16);
  --font-h:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-b:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-m:"DM Mono","SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1517; --surface:#162024; --surface2:#1C282D; --rail:#121B1E;
  --navy:#0B1113; --ink:#9FC3D0; --teal:#63B6C4; --teal-d:#7FC6D2; --teal-bg:#173239; --kraft:#C9A673; --kraft-bg:#2C2519;
  --text:#E5ECEC; --text2:#A5B4B8; --muted:#6F8087; --border:#24343A; --border2:#2F434A;
  --income:#5BBF92; --income-bg:#15302A; --expense:#E27F66; --expense-bg:#3A2420;
  --warn:#D6A54A; --warn-bg:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --lift:0 12px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --ground:#0E1517; --surface:#162024; --surface2:#1C282D; --rail:#121B1E;
  --navy:#0B1113; --ink:#9FC3D0; --teal:#63B6C4; --teal-d:#7FC6D2; --teal-bg:#173239; --kraft:#C9A673; --kraft-bg:#2C2519;
  --text:#E5ECEC; --text2:#A5B4B8; --muted:#6F8087; --border:#24343A; --border2:#2F434A;
  --income:#5BBF92; --income-bg:#15302A; --expense:#E27F66; --expense-bg:#3A2420;
  --warn:#D6A54A; --warn-bg:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --lift:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
/* rail */
.side{background:var(--rail);padding:20px 12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border);overflow-y:auto}
.brand{text-align:center;margin:0 0 14px;padding:10px 6px 14px;border-bottom:1px solid var(--border)}
.brand img{width:108px;height:auto;display:block;margin:0 auto}
.logo-d{display:none!important}
:root[data-theme="dark"] .logo-l{display:none!important}
:root[data-theme="dark"] .logo-d{display:block!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
.brand small{display:block;font-size:10px;letter-spacing:.35em;color:var(--muted);margin-top:6px}
.navgroup{font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding:12px 12px 4px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--text2);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;text-align:left;position:relative}
.navbtn svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.6}
.navbtn:hover{background:var(--surface);color:var(--text)}
.navbtn.on{background:var(--surface);color:var(--teal-d);font-weight:600;box-shadow:var(--shadow)}
.navbtn .badge{margin-left:auto;background:var(--expense);color:#fff;font-size:10.5px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--border)}
.side-foot button{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.side-foot button:hover{background:var(--surface);color:var(--text)}
.kbd{font-family:var(--font-m);font-size:11px;border:1px solid var(--border2);border-radius:5px;padding:0 5px;color:var(--muted)}
/* mobile chrome */
.topbar,.tabbar,.fab{display:none}
/* AIアシスタント */
.aifab{position:fixed;right:18px;bottom:18px;z-index:45;width:68px;height:68px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:var(--lift);cursor:pointer}
.aifab:hover{background:var(--teal-d)}
.aipanel{position:fixed;right:18px;bottom:100px;z-index:71;width:min(380px,calc(100vw - 24px));max-height:min(70vh,620px);display:flex;flex-direction:column;box-shadow:var(--lift);overflow:hidden;padding:0}
.scanpanel{position:fixed;right:16px;bottom:100px;z-index:70;width:min(430px,calc(100vw - 24px));max-height:62vh;overflow:auto;box-shadow:var(--lift);padding:14px 16px}
.aipanel .aihead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.aipanel .aihead b{font-family:var(--font-h);font-size:15px;display:flex;align-items:center;gap:8px}
.aihead img{width:42px;height:42px;object-fit:contain}
.aifab img{width:78px;height:78px;min-width:78px;min-height:78px;flex-shrink:0;object-fit:contain}
.aipanel .aichips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border);flex:0 0 auto}
.aipanel .aimsgs{flex:1 1 auto;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.aibub{max-width:88%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.aibub.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.aibub.ai{align-self:flex-start;background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
.aibub.err{align-self:flex-start;background:var(--expense-bg);color:var(--expense);border-bottom-left-radius:4px}
.aipanel .aiinput{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);flex:0 0 auto}
.aipanel .aiinput input{flex:1;min-width:0}
@media(max-width:820px){
  .aifab{left:18px;right:auto;bottom:calc(76px + env(safe-area-inset-bottom))}
  .aipanel{left:18px;right:auto;bottom:calc(152px + env(safe-area-inset-bottom))}
  .scanpanel{bottom:calc(140px + env(safe-area-inset-bottom))}
}
/* main */
.main{padding:28px 36px 80px;max-width:1200px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-family:var(--font-h);font-weight:700;font-size:28px;margin:0;letter-spacing:.04em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--text2);font-size:13px}
.head>div+div{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--teal);color:#0E1517}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){background:var(--teal);color:#0E1517}}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border2);font-weight:500}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal-d);filter:none}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.tealb{background:var(--teal)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.pad{padding:18px 20px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:11.5px;color:var(--text2);letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.kpi .val{font-family:var(--font-h);font-weight:700;font-size:26px;margin-top:6px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#EAF1F2}
.kpi.hero .lab,.kpi.hero .sub{color:#A9BCC6}
:root[data-theme="dark"] .kpi.hero{background:var(--teal-bg);border-color:var(--border2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.hero{background:var(--teal-bg);border-color:var(--border2)}}
.spark{display:block;width:100%;height:30px;margin-top:8px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.delta.up{background:var(--income-bg);color:var(--income)}.delta.down{background:var(--expense-bg);color:var(--expense)}.delta.flat{background:var(--surface2);color:var(--muted)}
.kpi.hero .delta.up{background:rgba(91,191,146,.22);color:#9FE0BF}.kpi.hero .delta.down{background:rgba(226,127,102,.22);color:#F3B3A0}.kpi.hero .delta.flat{background:rgba(255,255,255,.12);color:#C9D6DC}
.dsub{font-size:11px;color:var(--muted);margin-left:6px}
.kpi .sub{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;min-height:18px}
.chart{position:relative;width:100%;touch-action:pan-y}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:7px 11px;font-size:12px;box-shadow:var(--shadow);min-width:160px;z-index:3;line-height:1.6}
.ctip b{display:block;font-family:var(--font-m);font-size:11.5px;color:var(--text2);margin-bottom:2px}
.ctip div{display:flex;align-items:center;gap:6px}.ctip .num{margin-left:auto;font-family:var(--font-m);padding-left:10px}
.range{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.range button{border:0;background:var(--surface);color:var(--text2);padding:4px 10px;font-size:12px;cursor:pointer}
.range button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .range button.on{background:var(--teal);color:#0E1517}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .range button.on{background:var(--teal);color:#0E1517}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
h2.sec{font-family:var(--font-h);font-size:17px;margin:28px 0 12px;font-weight:700;letter-spacing:.04em;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
h2.sec small{font-family:var(--font-b);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.1em;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono,.mono{font-family:var(--font-m);font-size:12.5px;letter-spacing:.01em}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.p-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.p-teal{background:var(--teal-bg);color:var(--teal-d)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-inc{background:var(--income-bg);color:var(--income)}
.p-exp{background:var(--expense-bg);color:var(--expense)}
.p-kraft{background:var(--kraft-bg);color:var(--kraft)}
.inc{color:var(--income);font-weight:600}.exp{color:var(--expense);font-weight:600}
.linkbtn{background:none;border:0;color:var(--teal-d);cursor:pointer;font-size:12px;padding:3px 6px;border-radius:6px}
.linkbtn:hover{background:var(--teal-bg)}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:20px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{background:var(--teal);border-color:var(--teal);color:#0E1517}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--teal);border-color:var(--teal);color:#0E1517}}
/* inbox (今日やること) */
.inbox{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task .sev{align-self:stretch;border-radius:4px;background:var(--border2)}
.task.crit .sev{background:var(--expense)}.task.warn .sev{background:var(--warn)}.task.info .sev{background:var(--teal)}
.task .t1{font-size:13.5px;font-weight:600}
.task .t2{font-size:12px;color:var(--muted)}
.allclear{padding:22px 18px;display:flex;align-items:center;gap:12px;color:var(--text2);font-size:13px}
/* forms/modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--lift);width:100%;max-width:720px;padding:24px 26px}
.modal h3{font-family:var(--font-h);font-size:20px;margin:0 0 18px;letter-spacing:.03em}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:5px;font-weight:500;letter-spacing:.04em}
input,select,textarea{width:100%;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;font-family:var(--font-b)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.itemrow{display:grid;grid-template-columns:1fr 70px 110px 78px 34px;gap:8px;align-items:center;margin-bottom:8px}
.itemrow input{padding:7px 9px;font-size:13px}
.iconbtn{border:1px solid var(--border2);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--expense);width:34px;height:34px;font-size:15px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.tot{text-align:right;font-size:13px;color:var(--text2);line-height:1.9}
.tot b{font-family:var(--font-h);font-size:20px;color:var(--text);margin-left:14px;font-variant-numeric:tabular-nums}
.chk{width:20px;height:20px;border:2px solid var(--border2);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.chk.done{background:var(--teal);border-color:var(--teal);color:#fff}
.todo-done td{color:var(--muted);text-decoration:line-through}
canvas{max-width:100%;display:block}
.legend{display:flex;gap:18px;font-size:12px;color:var(--text2);margin-top:10px;flex-wrap:wrap}
.spin{width:30px;height:30px;border:3px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dropz{border:2px dashed var(--border2);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface2);transition:.15s}
.dropz:hover,.dropz.drag{border-color:var(--teal);background:var(--teal-bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--text)}
.seg button b{font-size:14px;display:block}
.seg button small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.seg button.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.seg .sgn{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.seg .sgn.inc{background:var(--income-bg);color:var(--income)}.seg .sgn.exp{background:var(--expense-bg);color:var(--expense)}
.sgnb{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.sgnb.inc{background:var(--income-bg);color:var(--income)}.sgnb.exp{background:var(--expense-bg);color:var(--expense)}
.doclist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}
.doctable tr.grp td{background:var(--kraft-bg);cursor:pointer;padding:10px 14px;font-size:13px}
.doctable tr.grp td>*{margin-right:12px}
.doctable tr.grp:hover td{filter:brightness(.97)}
.caret{display:inline-block;width:12px;color:var(--kraft);font-size:11px}
.filechip{display:inline-flex;align-items:center;gap:4px;margin-top:5px;border:0;background:var(--teal-bg);color:var(--teal-d);border-radius:8px;padding:3px 8px;font-size:11.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recdz{padding:12px 14px}
.recbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.recbtns .btn{flex:1 1 180px;justify-content:center}
.rectoggle{display:block;background:none;border:0;padding:8px 2px 4px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;text-align:left}
.rectoggle:hover{color:var(--teal-d)}
.recform{border-top:1px dashed var(--border2);padding-top:12px;margin-top:4px}
.reccheck{display:flex;gap:8px;align-items:center;font-size:13px;margin:2px 0 4px}
.reccheck input{width:auto;margin:0}
.recgo{width:100%;justify-content:center;margin-top:8px}
.recnote{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.fstable td,.fstable th{padding:8px 14px;font-size:13px}
.fstable tbody tr:hover{background:transparent}
@media(max-width:820px){#fsgrid{grid-template-columns:1fr!important}}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 12px 10px 18px;border-radius:12px;box-shadow:var(--lift);z-index:90;font-size:13.5px;display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .2s}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:3px 10px;font-size:12.5px;cursor:pointer}
:root[data-theme="dark"] .toast{background:#24363C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#24363C}}
/* palette */
.pal{max-width:560px;padding:0;overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:16px 18px;font-size:15px}
.pal input:focus{outline:none}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.pal .it.sel,.pal .it:hover{background:var(--teal-bg)}
.pal .it small{margin-left:auto;color:var(--muted);font-size:11.5px}
/* mobile */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar img{height:34px;width:auto}
  .topbar .tt{font-family:var(--font-h);font-weight:700;font-size:16px;letter-spacing:.06em}
  .topbar button{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 0;cursor:pointer;position:relative}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
  .tabbar button.on{color:var(--teal-d);font-weight:600}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--expense);color:#fff;font-size:9.5px;border-radius:9px;padding:0 5px;line-height:15px}
  .fab{display:flex;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:41;width:54px;height:54px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:28px;align-items:center;justify-content:center;box-shadow:var(--lift);cursor:pointer}
  .main{padding:18px 16px 120px}
  .head h1{font-size:23px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:21px}
  .row3{grid-template-columns:1fr}
  .modal{padding:20px 18px}
  .overlay{padding:16px 10px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));max-width:92vw}
  .hide-m{display:none!important}
  .docact{grid-template-columns:1fr!important}
  table.mtable tr.grp td{justify-content:flex-start!important;flex-wrap:wrap}
  #scanpanel{right:10px!important;bottom:calc(84px + env(safe-area-inset-bottom))!important}
  .main .grid[style*="repeat(3"]{grid-template-columns:1fr!important}
  .main .grid[style*="repeat(3"] .kpi{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px}
  .main .grid[style*="repeat(3"] .kpi .val{margin-top:0;font-size:20px}
  table.mtable thead{display:none}
  table.mtable,table.mtable tbody{display:block}
  table.mtable tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  table.mtable tbody tr:last-child{border-bottom:0}
  table.mtable td{border:0;padding:0}
  table.mtable td.num{margin-left:auto}
  table.mtable td:last-child{width:100%;display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;margin-left:0}
  table.mtable td.empty{width:100%;justify-content:center}
}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--lift);padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:4px auto 10px}
.sheet button.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 10px;font-size:15px;color:var(--text);border-radius:10px;cursor:pointer;text-align:left}
.sheet button.row:hover{background:var(--surface2)}
.sheet svg{width:20px;height:20px;stroke:var(--teal-d);fill:none;stroke-width:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* print */
#printArea{display:none}
@media print{
  .app,.topbar,.tabbar,.fab,.aifab,.aipanel{display:none!important}
  #printArea{display:block;color:#111;font-family:var(--font-b)}
  body{background:#fff}
}
</style>

const CHARTS=new Map();let chartSeq=0;
function fmtK(n){const a=Math.abs(n);const s=n<0?"-":"";if(a>=1e8)return s+(a/1e8).toFixed(1).replace(/\.0$/,"")+"億";if(a>=1e4)return s+(a/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,"")+"万";return s+Math.round(a).toLocaleString("ja-JP");}
function niceStep(x){if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
/* 前期比チップ：▲ 12.3%（緑＝良い方向、赤＝悪い方向）。goodUp=true なら増えるのが良い（収入）、false なら減るのが良い（支出） */
function deltaChip(cur,prev,goodUp,label){label=label||"前月比";
  if(prev==null||!prev)return`<span class="delta flat">—</span><span class="dsub">${esc(label.replace(/比$/,""))}の記録なし</span>`;
  const p=(cur-prev)/Math.abs(prev)*100,flat=Math.abs(p)<0.05,good=goodUp?p>=0:p<=0;
  const txt=flat?"±0.0%":(p>0?"▲ ":"▼ ")+Math.abs(p).toFixed(1)+"%";
  return`<span class="delta ${flat?"flat":good?"up":"down"}">${txt}</span><span class="dsub">${esc(label)}（${yen(prev)}）</span>`;}
function chartHTML(cfg){const id="c"+(++chartSeq);CHARTS.set(id,cfg);return`<div class="chart" data-cid="${id}" style="height:${cfg.height||240}px" role="img" aria-label="${esc(cfg.aria||"グラフ")}"></div>`;}
function mountCharts(root){(root||document).querySelectorAll(".chart[data-cid]").forEach(el=>{const cfg=CHARTS.get(el.dataset.cid);if(cfg)drawSvgChart(el,cfg);});}
function drawSvgChart(el,cfg){
  const W=el.clientWidth||600,H=cfg.height||240,padL=cfg.padL!=null?cfg.padL:44,padR=12,padT=14,padB=26;
  const n=cfg.labels.length,bars=cfg.bars||[],line=cfg.line||null,spread=cfg.mode==="spread";
  const all=[...bars.flatMap(b=>b.vals),...(line?line.vals:[])].map(v=>+v||0);
  let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx===mn)mx=mn+1;
  const step=niceStep((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;if(mx===mn)mx=mn+step;
  const cw=W-padL-padR,ch=H-padT-padB;
  const X=i=>padL+cw*(n<=1?0.5:spread?i/(n-1):(i+0.5)/n),Y=v=>padT+ch-(v-mn)/(mx-mn)*ch;
  const gid="g"+el.dataset.cid;let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;overflow:visible">`;
  if(line)svg+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${line.color}" stop-opacity=".26"/><stop offset="1" stop-color="${line.color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let v=mn;v<=mx+1e-9;v+=step){const y=Y(v).toFixed(1);svg+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--border)" ${v===0?'stroke-width="1.2"':'stroke-dasharray="2 3"'}/><text x="${padL-6}" y="${+y+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="DM Mono,monospace">${fmtK(v)}</text>`;}
  const slot=cw/Math.max(1,n),bw=Math.max(4,Math.min(22,slot*(bars.length>1?.26:.5)));
  bars.forEach((b,bi)=>b.vals.forEach((v,i)=>{v=+v||0;if(!v)return;const cx=X(i)+(bi-(bars.length-1)/2)*(bw+3),y=Y(Math.max(0,v)),y0=Y(0);svg+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.abs(y0-y).toFixed(1)}" rx="3" fill="${b.color}" opacity=".9"/>`;}));
  if(line){const pts=line.vals.map((v,i)=>[X(i),Y(+v||0)]);const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    if(line.area!==false&&pts.length>1)svg+=`<path d="${path} L${pts[pts.length-1][0].toFixed(1)} ${Y(mn).toFixed(1)} L${pts[0][0].toFixed(1)} ${Y(mn).toFixed(1)} Z" fill="url(#${gid})"/>`;
    svg+=`<path d="${path}" fill="none" stroke="${line.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(line.dots!==false)pts.forEach((p,i)=>{const last=i===pts.length-1;svg+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.2:2.6}" fill="${last?line.color:"var(--surface)"}" stroke="${line.color}" stroke-width="1.6"/>`;});
    else{const p=pts[pts.length-1];svg+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2" fill="${line.color}"/>`;}
    if(line.mark!=null&&pts[line.mark]){const p=pts[line.mark];svg+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${line.markColor||"var(--expense)"}" stroke="var(--surface)" stroke-width="2"/>`;}}
  const every=Math.max(1,Math.ceil(n/(cfg.maxLabels||8)));
  cfg.labels.forEach((l,i)=>{if(i%every&&i!==n-1)return;if(i===n-1&&n>1&&(n-1)%every&&(n-1)-Math.floor((n-1)/every)*every<every/2)return;svg+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${spread&&i===n-1?"end":spread&&i===0?"start":"middle"}" font-size="11" fill="var(--muted)">${esc(l)}</text>`;});
  svg+=`<line class="xh" x1="0" x2="0" y1="${padT}" y2="${padT+ch}" stroke="var(--text2)" stroke-dasharray="3 3" opacity="0"/></svg><div class="ctip" hidden></div>`;
  el.innerHTML=svg;
  const xh=el.querySelector(".xh"),tip=el.querySelector(".ctip"),fmt=cfg.fmt||yen;
  const move=e=>{const r=el.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let best=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(X(i)-x);if(d<bd){bd=d;best=i;}}
    xh.setAttribute("x1",X(best));xh.setAttribute("x2",X(best));xh.setAttribute("opacity","1");
    const rows=[...bars.map(b=>[b.name,b.vals[best],b.color]),...(line?[[line.name,line.vals[best],line.color]]:[])];
    tip.innerHTML=`<b>${esc(cfg.tipLabels?cfg.tipLabels[best]:cfg.labels[best])}</b>`+rows.map(rw=>`<div><span class="dot" style="background:${rw[2]}"></span>${esc(rw[0])}<span class="num">${fmt(+rw[1]||0)}</span></div>`).join("")+(cfg.tipExtra?cfg.tipExtra(best):"");
    tip.hidden=false;const tw=tip.offsetWidth;let lx=X(best)+12;if(lx+tw>W-4)lx=X(best)-tw-12;tip.style.left=Math.max(0,lx)+"px";tip.style.top=(padT+2)+"px";};
  const leave=()=>{xh.setAttribute("opacity","0");tip.hidden=true;};
  el.onmousemove=move;el.onmouseleave=leave;el.ontouchstart=e=>{move(e);};el.ontouchmove=e=>{move(e);};el.ontouchend=leave;
}

/* ---------- 書類の写真/PDFから記録（AI読み取り） ---------- */
let pdfLibP=null;
const blobToB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error||new Error("read failed"));r.readAsDataURL(blob);});
/* 添付：縮小済み JPEG・PDF を Firestore の files/{id} に base64 で保存（900KB まで）。端末の IndexedDB は控え */
async function filePut(file){const id="f"+uid();try{await idbPut(id,file);}catch(e){}
  try{if(fs&&file.size<=900*1024){await fs.doc("files/"+id).set({name:file.name||"file",mime:file.type||"application/octet-stream",size:file.size,b64:await blobToB64(file),at:new Date().toISOString()});}}catch(e){}
  return id;}
async function fileGet(id){try{const c=await idbGet(id);if(c)return c;}catch(e){}if(!fs)return null;const d=await fs.doc("files/"+id).get();if(!d.exists)return null;const x=d.data();const b=b64ToBlob(x.b64,x.mime);try{await idbPut(id,b);}catch(e){}return b;}
const b64ToBlob=(b64,mime)=>{const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||"application/octet-stream"});};
/* Gemini をブラウザから直接呼ぶ。キーはこの端末の設定にだけ保存 */
const GKEY=()=>{let k="";try{k=(localStorage.getItem("suisui_gemini_key")||"").trim();}catch(e){}return k||((cloudCfg&&cloudCfg.geminiKey)||"").trim();};
/* キーを共有設定にも保存（許可された人なら全端末で使える） */
async function saveKeyShared(k){try{localStorage.setItem("suisui_gemini_key",k);}catch(e){}try{if(fs&&cloudCfg){await fs.doc("app/config").set({geminiKey:k},{merge:true});cloudCfg.geminiKey=k;}}catch(e){}}
async function geminiRaw(payload){const key=GKEY();if(!key)throw new Error("Gemini の API キーが未設定です（事業者設定で入力してください）");
  let model="gemini-3.6-flash";try{model=localStorage.getItem("suisui_gemini_model")||model;}catch(e){}
  const call=async m=>{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});return{code:r.status,body:await r.text()};};
  let r=await call(model);
  if(r.code===429||r.code>=500){await new Promise(x=>setTimeout(x,12000));r=await call(model);}
  if(r.code===404){try{const lr=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+encodeURIComponent(key));const d=await lr.json();const names=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/",""));const clean=names.filter(n=>!/preview|exp|thinking|image|tts|live|embedding|aqa|8b|omni|lyria|research/i.test(n));const pick=clean.filter(n=>/flash/.test(n)).sort().reverse()[0]||clean.filter(n=>/pro/.test(n)).sort().reverse()[0]||names[0];if(pick&&pick!==model){model=pick;try{localStorage.setItem("suisui_gemini_model",model);}catch(e){}r=await call(model);}}catch(e){}}
  if(r.code!==200){let msg="";try{msg=JSON.parse(r.body).error.message;}catch(e){msg=String(r.body).slice(0,160);}if(r.code===401||r.code===403||/API key not valid|API_KEY_INVALID|PERMISSION_DENIED|invalid authentication/i.test(msg))throw new Error("Gemini の API キーが正しくありません（aistudio.google.com/apikey で「鍵をコピー」した文字列を貼ってください）");throw new Error("Gemini エラー（"+r.code+"）: "+msg);}
  const d=JSON.parse(r.body);const c=d.candidates&&d.candidates[0];if(!c||!c.content||!c.content.parts)throw new Error("Gemini から結果が返りませんでした"+(d.promptFeedback?"（内容がブロックされました）":""));return c.content.parts;}
const ai={async json(prompt,opt){opt=opt||{};const parts=[{text:prompt}];for(const b of (opt.images||[]))parts.push({inline_data:{mime_type:b.type||"image/jpeg",data:await blobToB64(b)}});const out=await geminiRaw({contents:[{parts}],generationConfig:{responseMimeType:"application/json"}});const text=out.map(p=>p.text||"").join("");try{return JSON.parse(text);}catch(e){const m=text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(m){try{return JSON.parse(m[0]);}catch(_){}}throw new Error("読み取り結果を解釈できませんでした");}},
  async chat(sys,contents,tools){const payload={systemInstruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:0.4}};if(tools&&tools.length)payload.tools=[{functionDeclarations:tools}];const parts=await geminiRaw(payload);return{text:parts.map(p=>p.text||"").join("").trim(),calls:parts.filter(p=>p.functionCall).map(p=>({name:p.functionCall.name,args:p.functionCall.args||{}})),parts};}};

  o.querySelector("#gk_ok").onclick=async()=>{const v=o.querySelector("#gk_in").value.trim();if(!v){o.querySelector("#gk_msg").textContent="キーを入力してください";return;}const b=o.querySelector("#gk_ok");b.disabled=true;b.textContent="確認中…";try{localStorage.setItem("suisui_gemini_key",v);const r=await ai.json('{"ok":true} とだけ返してください');if(!(r&&r.ok))throw new Error("応答の形式が想定と違います");await saveKeyShared(v);toast("Gemini に接続できました（この設定は許可されたメンバー全員で使えます）");close(true);}catch(e){try{localStorage.removeItem("suisui_gemini_key");}catch(_){}o.querySelector("#gk_msg").textContent=e.message||"接続できませんでした";b.disabled=false;b.textContent="接続して保存";}};

      <div class="field" style="margin:0"><label>期限</label><input type="date" id="t_due"></div>

      <td>${esc(t.title)}${t.repeat?` <span class="pill p-teal" style="font-size:10px">${t.repeat}</span>`:""}</td>
      <td><span class="pill ${t.pri==="高"?"p-exp":t.pri==="低"?"p-gray":"p-warn"}">${t.pri}</span></td>

    </tr>`).join(""):`<tr><td colspan="5" class="empty">タスクがありません。</td></tr>`}</tbody>

window.addTodo=function(){const v=$("#t_title").value.trim();if(!v){toast("タスクを入力してください");return;}state.todos.push({id:uid(),title:v,due:$("#t_due").value,pri:$("#t_pri").value,repeat:$("#t_rep").value,done:false});save();vTodo();};
function nextDue(d,rep){const dt=new Date(d+"T00:00:00");if(rep==="毎週")dt.setDate(dt.getDate()+7);else if(rep==="毎月")dt.setMonth(dt.getMonth()+1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
window.toggleTodo=id=>{const t=state.todos.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done&&t.repeat&&t.due){state.todos.push({id:uid(),title:t.title,due:nextDue(t.due,t.repeat),pri:t.pri,repeat:t.repeat,done:false});toast("次回タスクを作成しました");}save();vTodo();};
window.editTodo=function(id){const t=state.todos.find(x=>x.id===id);if(!t)return;openModal("タスクを編集",`
    <div class="field"><label>タスク *</label><input id="et_title" value="${esc(t.title)}"></div>
    <div class="row3">
      <div class="field"><label>期限</label><input type="date" id="et_due" value="${t.due||""}"></div>
      <div class="field"><label>優先度</label><select id="et_pri">${["中","高","低"].map(p=>`<option ${t.pri===p?"selected":""}>${p}</option>`).join("")}</select></div>
      <div class="field"><label>繰り返し</label><select id="et_rep">${[["","なし"],["毎週","毎週"],["毎月","毎月"]].map(r=>`<option value="${r[0]}" ${(t.repeat||"")===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></div>
    </div>
  `,()=>{const v=$("#et_title").value.trim();if(!v){toast("タスクを入力してください");return false;}t.title=v;t.due=$("#et_due").value;t.pri=$("#et_pri").value;t.repeat=$("#et_rep").value;save();closeModal();vTodo();});};

/* ---------- REPORT (レポート) ---------- */
let reportYear=String(new Date().getFullYear());
function vReport(){
  const years=[...new Set([...state.txns.map(t=>(t.date||"").slice(0,4)),...state.docs.map(d=>(d.issueDate||"").slice(0,4))].filter(Boolean))].sort().reverse();
  if(!years.length)years.push(String(new Date().getFullYear()));
  if(!years.includes(reportYear))reportYear=years[0];
  const y=reportYear;
  const tin=state.txns.filter(t=>isPL(t)&&t.type==="収入"&&(t.date||"").slice(0,4)===y);
  const tex=state.txns.filter(t=>isPL(t)&&t.type==="支出"&&(t.date||"").slice(0,4)===y);
  const inc=tin.reduce((a,b)=>a+ +b.amount,0),exp=tex.reduce((a,b)=>a+ +b.amount,0),profit=inc-exp;
  const py=String(+y-1);
  const pyInc=sumPL(t=>t.type==="収入"&&(t.date||"").slice(0,4)===py);
  const pyExp=sumPL(t=>t.type==="支出"&&(t.date||"").slice(0,4)===py);
  const byAcct=arr=>{const m={};arr.forEach(x=>{const k=x.category||"未分類";m[k]=(m[k]||0)+ +x.amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const incB=byAcct(tin),expB=byAcct(tex),expMax=Math.max(1,...expB.map(e=>e[1]));
  const taxDocs=state.docs.filter(d=>(d.type==="請求書"||d.type==="領収書")&&isIssued(d)&&!d.fromId&&(d.issueDate||"").slice(0,4)===y);
  /* 年間の消費税は「各書類の税額の合計」。書類ごと・税率ごとに端数処理してから積み上げる */
  const rate={};taxDocs.forEach(d=>{const g=calc(d).groups;Object.keys(g).forEach(k=>{const r=+k||0;if(!rate[r])rate[r]={base:0,tax:0};rate[r].base+=g[k];rate[r].tax+=Math.floor(g[k]*r/100);});});
  const rateRows=Object.keys(rate).sort((a,b)=>b-a);
  const salesItems={};state.docs.filter(d=>(d.type==="領収書"||(d.type==="請求書"&&d.status==="入金済"))&&isIssued(d)&&!d.fromId&&(d.issueDate||"").slice(0,4)===y).forEach(d=>(d.items||[]).forEach(it=>{const k=it.name||"（無名）";const amt=(+it.qty||0)*(+it.price||0);if(!salesItems[k])salesItems[k]={qty:0,amt:0};salesItems[k].qty+=(+it.qty||0);salesItems[k].amt+=amt;}));
  const salesRank=Object.entries(salesItems).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8);const salesMax=Math.max(1,...salesRank.map(s=>s[1].amt));
  const upcoming={};state.docs.filter(d=>d.type==="請求書"&&d.status!=="入金済"&&isIssued(d)).forEach(d=>{const k=d.dueDate?d.dueDate.slice(0,7):"期限未設定";upcoming[k]=(upcoming[k]||0)+calc(d).total;});
  const upRows=Object.entries(upcoming).sort((a,b)=>a[0].localeCompare(b[0]));
  const mons=[];for(let i=1;i<=12;i++){const mm=y+"-"+String(i).padStart(2,"0");mons.push({i,inc:sumPL(t=>t.type==="収入"&&ym(t.date)===mm),exp:sumPL(t=>t.type==="支出"&&ym(t.date)===mm)});}
  $("#main").innerHTML=`
  <div class="head"><div><h1>レポート</h1><p>年度ごとの損益・勘定科目内訳・消費税集計。確定申告の下準備に。</p></div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="ry" style="width:auto" onchange="reportYear=this.value;vReport()">${years.map(yy=>`<option ${yy===y?"selected":""}>${yy}</option>`).join("")}</select>
      <button class="btn ghost sm" onclick="csvTxn('${y}')">収支CSV</button>
      <button class="btn ghost sm" onclick="csvDocs('${y}')">書類CSV</button>
      <button class="btn ghost sm" onclick="csvAccounts('${y}')">科目集計CSV</button>
    </div></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:22px">
    <div class="kpi"><div class="lab inc">売上（収入）</div><div class="val inc">${yen(inc)}</div><div class="sub">${deltaChip(inc,pyInc,true,"前年比")}</div></div>
    <div class="kpi"><div class="lab exp">経費（支出）</div><div class="val exp">${yen(exp)}</div><div class="sub">${deltaChip(exp,pyExp,false,"前年比")}</div></div>
    <div class="kpi"><div class="lab">差引利益（概算）</div><div class="val" style="color:${profit>=0?"var(--income)":"var(--expense)"}">${yen(profit)}</div><div class="sub">${deltaChip(profit,pyInc-pyExp,true,"前年比")}<span class="dsub">利益率 ${inc?Math.round(profit/inc*1000)/10:0}%</span></div></div>
  </div>
  <div class="card pad" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 class="sec" style="margin:0">月別の推移 <small>${y}年・収入と支出（棒）、累計の利益（線）</small></h2></div>
    <div style="margin-top:10px">${chartHTML({labels:mons.map(m=>m.i+"月"),tipLabels:mons.map(m=>y+"年"+m.i+"月"),height:220,aria:"月別の収入・支出と累計利益",bars:[{name:"収入",vals:mons.map(m=>m.inc),color:"var(--income)"},{name:"支出",vals:mons.map(m=>m.exp),color:"var(--expense)"}],line:{name:"累計利益",vals:mons.reduce((a,m)=>{a.push((a.length?a[a.length-1]:0)+m.inc-m.exp);return a;},[]),color:"var(--ink)"}})}</div>
    <div class="legend"><span><span class="dot" style="background:var(--income)"></span> 収入</span><span><span class="dot" style="background:var(--expense)"></span> 支出</span><span><span class="dot" style="background:var(--ink)"></span> 累計利益</span></div></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="pad" style="padding-bottom:6px"><h2 class="sec" style="margin:0">経費の勘定科目内訳</h2></div>
      <div class="pad" style="padding-top:8px">${expB.length?expB.map(e=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(e[0])}</span><span class="num">${yen(e[1])}</span></div><div style="height:7px;background:var(--surface2);border-radius:4px;margin-top:4px;overflow:hidden"><div style="height:100%;width:${Math.round(e[1]/expMax*100)}%;background:var(--expense)"></div></div></div>`).join(""):`<div class="empty">支出データがありません</div>`}</div></div>
    <div class="card"><div class="pad" style="padding-bottom:6px"><h2 class="sec" style="margin:0">売上の勘定科目内訳</h2></div>
      <div class="tablewrap"><table><tbody>${incB.length?incB.map(e=>`<tr><td>${esc(e[0])}</td><td class="num inc">${yen(e[1])}</td></tr>`).join(""):`<tr><td class="empty">収入データがありません</td></tr>`}</tbody></table></div></div>
  </div>
  <h2 class="sec">今月の予算と実績</h2>
  ${budgetHTML(ym(today()))}
  <h2 class="sec">商品別 売上ランキング（確定売上・${y}年）</h2>
  <div class="card pad">${salesRank.length?salesRank.map(s=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(s[0])}<span style="color:var(--muted)">　${s[1].qty}点</span></span><span class="num">${yen(s[1].amt)}</span></div><div style="height:7px;background:var(--surface2);border-radius:4px;margin-top:4px;overflow:hidden"><div style="height:100%;width:${Math.round(s[1].amt/salesMax*100)}%;background:var(--teal)"></div></div></div>`).join(""):`<div class="empty">確定売上（領収書・入金済請求書）がまだありません</div>`}</div>
  <h2 class="sec">今後の入金予定（未回収の請求書）</h2>
  <div class="card tablewrap"><table>
    <thead><tr><th>入金予定月</th><th class="num">金額(税込)</th></tr></thead>
    <tbody>${upRows.length?upRows.map(r=>`<tr><td>${r[0]==="期限未設定"?'<span class="pill p-gray">期限未設定</span>':(r[0]<ym(today())?`<span class="pill p-exp">${r[0]} 超過</span>`:r[0])}</td><td class="num">${yen(r[1])}</td></tr>`).join(""):`<tr><td colspan="2" class="empty">未回収の請求書はありません</td></tr>`}
    ${upRows.length?`<tr style="font-weight:700"><td>合計</td><td class="num">${yen(upRows.reduce((a,r)=>a+r[1],0))}</td></tr>`:""}</tbody>
  </table></div>
  <h2 class="sec">消費税集計（税率別・請求書/領収書ベース）</h2>
  <div class="card tablewrap"><table>
    <thead><tr><th>税率</th><th class="num">課税売上(税抜)</th><th class="num">消費税額</th><th class="num">税込</th></tr></thead>
    <tbody>${rateRows.length?rateRows.map(r=>`<tr><td>${r==0?"非課税/対象外":r+"%"}</td><td class="num">${yen(rate[r].base)}</td><td class="num">${yen(rate[r].tax)}</td><td class="num">${yen(rate[r].base+rate[r].tax)}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">対象書類がありません</td></tr>`}
    ${rateRows.length?`<tr style="font-weight:700"><td>合計</td><td class="num">${yen(rateRows.reduce((a,r)=>a+rate[r].base,0))}</td><td class="num">${yen(rateRows.reduce((a,r)=>a+rate[r].tax,0))}</td><td class="num">${yen(rateRows.reduce((a,r)=>a+rate[r].base+rate[r].tax,0))}</td></tr>`:""}</tbody>

let fcDays=60,fcOverdue=false;
function forecastRun(days,withOverdue){
  const t=today(),end=addDays(t,days);
  const start=cashBal(t);
  const ev=[];
  state.docs.filter(d=>d.type==="請求書"&&d.status!=="入金済"&&isIssued(d)).forEach(d=>{
    let due=d.dueDate||(d.issueDate?addDays(d.issueDate,30):"");if(!due)return;
    if(due<=t){if(!withOverdue)return;due=addDays(t,7);}
    if(due<=end)ev.push({date:due,label:`入金予定 ${clientName(d.clientId)}（${d.number}）`,amt:calc(d).total,kind:"inv"});
  });
  state.docs.filter(d=>d.type==="請求書"&&d.status!=="入金済"&&!isIssued(d)).forEach(d=>{let due=d.dueDate||(d.issueDate?addDays(d.issueDate,30):"");if(!due)return;if(due<=t)due=addDays(t,1);if(due<=end)ev.push({date:due,label:`支払予定 ${partyName(d)}（${d.number}）`,amt:-docAmt(d),kind:"pay"});});
  /* 受取見積書＝まだ確定していない支出。ただし同じ相手・同じ金額の請求書を既に記録済みなら、そちらが確定なので見積は数えない（二重計上の防止） */
  const billed=state.docs.filter(d=>d.type==="請求書"&&!isIssued(d));
  state.docs.filter(d=>d.type==="見積書"&&!isIssued(d)&&d.status!=="失注"&&!d.noLink).forEach(d=>{
    const amt=docAmt(d);
    if(billed.some(b=>b.fromId===d.id||(partyName(b)===partyName(d)&&docAmt(b)===amt)))return;
    let due=d.dueDate||(d.issueDate?addDays(d.issueDate,30):"");if(!due)return;if(due<=t)due=addDays(t,1);
    if(due<=end)ev.push({date:due,label:`見込み支出 ${partyName(d)}（${d.number}）`,amt:-amt,kind:"quote"});});
  state.txns.filter(x=>x.date>t&&x.date<=end&&cashMove(x)).forEach(x=>ev.push({date:x.date,label:`予定 ${x.category||x.memo||""}`,amt:cashMove(x),kind:"txn"}));
  (state.recurring||[]).filter(r=>r.active!==false).forEach(r=>{
    const day=Math.min(+r.day||1,28);let y=+t.slice(0,4),m=+t.slice(5,7);
    for(let k=0;k<4;k++){const dt=`${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;const posted=r.lastPosted===dt.slice(0,7);
      if(dt>t&&dt<=end&&!posted)ev.push({date:dt,label:`固定費 ${r.memo||r.category}`,amt:r.type==="収入"?+r.amount:-r.amount,kind:"rec"});
      else if(dt<=t&&!posted&&k===0&&dt.slice(0,7)===t.slice(0,7))ev.push({date:addDays(t,1),label:`固定費 ${r.memo||r.category}（今月分・未計上）`,amt:r.type==="収入"?+r.amount:-r.amount,kind:"rec"});
      m++;if(m>12){m=1;y++;}}
  });
  ev.sort((a,b)=>a.date.localeCompare(b.date));
  let bal=start,low={v:start,d:t};const rows=ev.map(e=>{bal+=e.amt;if(bal<low.v)low={v:bal,d:e.date};return{...e,bal};});
  const inflow=ev.filter(e=>e.amt>0).reduce((a,e)=>a+e.amt,0),outflow=ev.filter(e=>e.amt<0).reduce((a,e)=>a-e.amt,0);
  return{start,end:bal,rows,low,inflow,outflow,endDate:end};
}

/* 通帳・明細の摘要はカタカナで印字される（例：オウジコンテナー、フリコミテスウリョウ）ため、漢字とカタカナの両方を拾う */
const CAT_RULES=[[/ヤマト|佐川|サガワ|日本郵便|郵便局|ユウビン|運輸|ウンユ|宅急便|段ボール|ダンボール|王子コンテナー|オウジコンテナ|クロネコ|ゆうパック|ユウパック/,"荷造運賃"],[/佐藤徹商店|サトウトオル|サトウテツ|白水|ハクスイ|仕入|シイレ/,"仕入高"],[/アマゾン|AMAZON|ヨドバシ|ホームセンター|ダイソー|ニトリ|モノタロウ|カウネット|アスクル|備品|消耗品/i,"消耗品費"],[/JR|ANA|JAL|交通|コウツウ|タクシー|ETC|ガソリン|ENEOS|エネオス|出光|イデミツ|高速|コウソク|バス|SUICA|ICOCA|SUGOCA|新幹線|シンカンセン|駐車|チユウシヤ/i,"旅費交通費"],[/ソフトバンク|ドコモ|DOCOMO|KDDI|AU |NTT|エヌティティ|GOOGLE|APPLE|さくら|XSERVER|サーバー|ドメイン|楽天モバイル|ラクテンモバイル/i,"通信費"],[/手数料|テスウリヨウ|テスウリョウ|フリコミテスウ/,"支払手数料"],[/META|FACEBOOK|INSTAGRAM|広告|コウコク|ラクスル|プリントパック|印刷|インサツ|チラシ|パンフレット/i,"広告宣伝費"],[/電気|デンキ|電力|デンリョク|九州電力|キユウシユウデンリヨク|ガス|水道|スイドウ/,"水道光熱費"],[/家賃|ヤチン|シェアオフィス|シエアオフイス|ALLIANCE|アライアンス|賃料|チンリヨウ/i,"地代家賃"],[/書店|BOOK|紀伊國屋|丸善|書籍|ショセキ/i,"新聞図書費"],[/SHOPIFY|STORES|SQUARE|STRIPE|BASE|ショピファイ/i,"EC定期売上"],[/生活費|セイカツヒ|私用|シヨウ|プライベート|個人用|コジンヨウ|自分へ|ジブンヘ/,"事業主貸"],[/自己資金|ジコシキン|自分のお金|個人から|コジンカラ|立替|タテカエ/,"事業主借"],[/振込|フリコミ|入金|ニユウキン|売上|ウリアゲ/,"売上高"]];
/* 通帳は「キユウシユウ」のように大きいカナ、明細は半角カナのこともあるので、表記ゆれを吸収してから照合する */
const kanaNorm=s=>String(s||"").normalize("NFKC").replace(/[\u30E3\u30E5\u30E7\u30A1\u30A3\u30A5\u30A7\u30A9\u30C3]/g,c=>"\u30E4\u30E6\u30E8\u30A2\u30A4\u30A6\u30A8\u30AA\u30C4"["\u30E3\u30E5\u30E7\u30A1\u30A3\u30A5\u30A7\u30A9\u30C3".indexOf(c)]);
/* 通帳の日付は銀行の決済日、領収書の日付は購入日で数日ずれる。日付が完全一致しないと重複を見逃し二重計上になるため、前後10日の同額・同区分を重複候補とする */
function findDupTxn(date,amount,type){const t=Date.parse(date+"T00:00:00");if(isNaN(t))return null;
  return (state.txns||[]).find(x=>x.type===type&&Math.round(+x.amount||0)===Math.round(amount)&&x.date&&Math.abs((Date.parse(x.date+"T00:00:00")-t)/86400000)<=10)||null;}
function guessCat(desc,type){const d=String(desc||""),dn=kanaNorm(d);const ok=[...(ACCTS[type]||[]),...(XFER[type]||[])];const past=state.txns.find(x=>x.type===type&&x.category&&x.memo&&x.memo.length>=2&&(d.includes(x.memo.replace(/（.*?）|\(.*?\)/g,"").trim().slice(0,8))));if(past)return past.category;for(const [re,c] of CAT_RULES){if((re.test(d)||re.test(dn))&&ok.includes(c))return c;}return type==="収入"?"売上高":"";}
function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[];}else f+=c;}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function normDate(s){s=String(s||"").trim().replace(/年|月/g,"/").replace(/日/,"");let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);if(m)return`${today().slice(0,4)}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;return"";}
const numOf=s=>{s=String(s||"").replace(/[¥￥,\s円]/g,"");if(!s)return 0;const neg=/^\(.*\)$/.test(s)||s.startsWith("-")||s.startsWith("−")||s.startsWith("▲");return(neg?-1:1)*(+s.replace(/[()\-−▲+]/g,"")||0);};
function detectRows(rows){
  const hi=rows.findIndex(r=>r.some(c=>/日付|取引日|利用日|年月日|date/i.test(c)));if(hi<0)return{error:"日付の列が見つかりません。1行目に「日付」「摘要」「入金」「出金」などの見出しがあるCSVを使ってください。"};
  const H=rows[hi].map(c=>c.trim());const f=re=>H.findIndex(c=>re.test(c));
  const di=f(/日付|取引日|利用日|年月日|date/i),ds=f(/摘要|内容|取引内容|利用店|ご利用先|明細|店名|description|備考/i),ii=f(/入金|お預り|預入|受入|入金額/),oi=f(/出金|お引出|引出|支払金額|ご利用金額|利用金額/),ai=f(/^金額$|金額（円）|amount/i);
  const card=ii<0&&oi>=0&&/利用/.test(H[oi]||"");const out=[];
  rows.slice(hi+1).forEach(r=>{const date=normDate(r[di]);if(!date)return;let inc=ii>=0?numOf(r[ii]):0,exp=oi>=0?numOf(r[oi]):0;if(ai>=0&&!inc&&!exp){const v=numOf(r[ai]);if(v>0)inc=v;else exp=-v;}if(card&&exp<0){inc=-exp;exp=0;}const amt=inc||exp;if(!amt)return;const type=inc?"収入":"支出";const desc=(ds>=0?r[ds]:r.filter((_,k)=>k!==di).join(" ")).trim();
    const hit=findDupTxn(date,Math.abs(amt),type);out.push({date,desc,type,amount:Math.abs(amt),category:guessCat(desc,type),use:"",dup:!!hit,dupAt:hit?hit.date:"",on:!hit});});
  return{rows:out,cols:{date:H[di],desc:H[ds],in:H[ii],out:H[oi]}};
}

function impLoad(text){const r=detectRows(parseCSV(text.replace(/^﻿/,"")));if(r.error){toast(r.error);return;}if(!r.rows.length){toast("取り込める行が見つかりませんでした");return;}impRows=r.rows;$("#impA").hidden=true;$("#impB").hidden=false;$("#impok").hidden=false;impDraw(r.cols);}
function impDraw(cols){

  ${impRows.map((r,i)=>`<tr style="${r.on?"":"opacity:.5"}"><td><input type="checkbox" style="width:auto" ${r.on?"checked":""} onchange="impRows[${i}].on=this.checked;impDraw()"></td><td class="mono" style="white-space:nowrap">${r.date}</td><td style="min-width:160px">${esc(r.desc)}${r.dup?` <span class="pill p-warn">重複?${r.dupAt?`（${md(r.dupAt)}の記録と同額）`:""}</span>`:""}</td><td><span class="pill ${r.type==="収入"?"p-inc":"p-exp"}">${r.type}</span></td><td class="num" style="white-space:nowrap">${yen(r.amount)}</td><td><input value="${esc(r.use||"")}" placeholder="例：段ボール代" style="min-width:150px;padding:5px 8px;font-size:12.5px" onchange="impUse(${i},this.value)"></td><td><input list="impcats" value="${esc(r.category)}" style="min-width:130px;padding:5px 8px;font-size:12.5px;${r.on&&!r.category?"border-color:var(--warn)":""}" onchange="impRows[${i}].category=this.value.trim()"></td></tr>`).join("")}

/* 「何に使ったか」を入れたら、その言葉も手がかりにして勘定科目を推定し直す（すでに手で直した科目は上書きしない） */
window.impUse=(i,v)=>{const r=impRows[i];if(!r)return;const had=r.category;r.use=String(v||"").trim();
  const g=guessCat([r.use,r.desc].filter(Boolean).join(" "),r.type);
  if(g&&(!had||had===guessCat(r.desc,r.type)))r.category=g;
  impDraw();};
async function impAI(){const s=ai;const tgt=impRows.map((r,i)=>({i,r})).filter(x=>x.r.on&&!x.r.category).slice(0,80);if(!tgt.length){toast("未設定の行はありません");return;}const b=$("#impai");b.disabled=true;b.textContent="推定中…";
  try{const res=await s.json("日本の個人事業（飲料水の卸・EC）の会計です。各取引の内容から勘定科目を1つずつ選んでください。支出の候補: "+ACCTS.支出.join("・")+"。収入の候補: "+ACCTS.収入.join("・")+"。JSON配列 [{\"i\":番号,\"category\":\"科目\"}] だけを返してください。\n"+tgt.map(x=>`${x.i}\t${x.r.type}\t${x.r.desc}\t${x.r.amount}円\t用途:${x.r.use||"（未入力）"}`).join("\n"),{modelTier:"quick"});
    (Array.isArray(res)?res:[]).forEach(o=>{const r=impRows[+o.i];if(r&&o.category&&(ACCTS[r.type]||[]).includes(o.category))r.category=o.category;});impDraw();toast("勘定科目を推定しました。確認してから取り込んでください");}
  catch(e){toast(e&&e.code==="not_granted"?"Claudeの利用が許可されていません":"推定できませんでした。手入力で設定してください");impDraw();}}
function impCommit(){const sel=impRows.filter(r=>r.on);if(!sel.length){toast("取り込む行を選んでください");return;}const ids=[];sel.forEach(r=>{const id=uid()+Math.random().toString(36).slice(2,4);ids.push(id);state.txns.push({id,type:r.type,date:r.date,category:r.category,amount:r.amount,pay:"預金",memo:[r.desc,r.use].filter(Boolean).join(" / ")+"（明細取込）"});});save();closeModal();go("money");toast(`${sel.length}件を取り込みました`,{label:"元に戻す",fn:()=>{state.txns=state.txns.filter(x=>!ids.includes(x.id));save();render();}});}

/* ---------- 在庫（BIB・資材・ロット・賞味期限） ---------- */
const baseName=n=>String(n||"").replace(/（.*?）|\(.*?\)/g,"").trim();
const litOf=n=>+((String(n).match(/(\d+(?:\.\d+)?)\s*L/i)||[])[1]||0);
const MAT_SUGGEST=[{name:"オリジナル印刷段ボール（20L夏箱）",unit:"枚",min:30,perShip:1,forProduct:"大分由布の天然炭酸水 BIB20L"},{name:"日田杉BIBスタンド",unit:"台",min:2,perShip:0},{name:"卓上アクリルスタンドPOP",unit:"個",min:5,perShip:0},{name:"チラシ・パンフレット",unit:"部",min:50,perShip:0}];
let stockTab="商品";
function stockItems(){const m=new Map();const add=(n,kind,unit,mat)=>{if(n&&!m.has(n))m.set(n,{name:n,kind,unit,mat:mat||null,L:kind==="商品"?litOf(n):0,key:"s"+m.size});};
  state.products.forEach(p=>add(baseName(p.name),"商品","箱"));(state.materials||[]).forEach(x=>add(x.name,"資材",x.unit||"個",x));
  (state.stockMoves||[]).forEach(x=>add(x.product,x.kind||"商品",x.unit||"箱"));return[...m.values()];}
const stockByKey=k=>stockItems().find(i=>i.key===k);
const minOf=it=>{const v=(state.stockMin||{})[it.name];return v!=null?v:it.mat?(+it.mat.min||0):5;};
function shipMoves(){const names=new Set(state.products.map(p=>baseName(p.name)));const drop=new Set((state.orders||[]).filter(o=>o.shipTo==="直送"&&o.linkDocId).map(o=>o.linkDocId));const out=[];state.docs.filter(d=>isIssued(d)&&!d.fromId&&!drop.has(d.id)&&(d.type==="請求書"||d.type==="領収書")).forEach(d=>(d.items||[]).forEach(it=>{const b=baseName(it.name);if(names.has(b)&&+it.qty)out.push({date:d.issueDate||"",product:b,qty:-(+it.qty),type:"出庫",memo:`${d.number} ${clientName(d.clientId)}`,auto:true,docId:d.id});}));return out;}
function useMoves(){const out=[];(state.materials||[]).filter(x=>+x.perShip>0).forEach(x=>(state.orders||[]).forEach(o=>{if(o.kind!=="商品"||(x.forProduct&&x.forProduct!==o.item))return;out.push({date:o.date,product:x.name,kind:"資材",qty:-(+o.qty)*(+x.perShip),type:"使用",memo:`発注 ${o.no} ${o.item} ${o.qty}箱`,auto:true});}));return out;}
function allMoves(){return[...(state.stockMoves||[]),...shipMoves(),...useMoves()].sort((a,b)=>(b.date||"").localeCompare(a.date||""));}
function stockOf(name){return allMoves().filter(m=>m.product===name).reduce((a,m)=>a+(+m.qty||0),0);}
/* ロット：賞味期限の近い順（先入れ先出し）に出荷を割り当てる */
function lotsOf(name){
  const mv=allMoves().filter(m=>m.product===name).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const lots=mv.filter(m=>+m.qty>0).map((m,i)=>({id:m.id||"a"+i,lot:m.lot||(m.type==="調整"?"棚卸し調整":""),date:m.date||"",made:m.madeDate||"",expiry:m.expiry||"",qty:+m.qty,left:+m.qty,ships:[]}));
  const order=[...lots].sort((a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999")||a.date.localeCompare(b.date));
  mv.filter(m=>+m.qty<0).forEach(m=>{let need=-m.qty;const take=l=>{const q=Math.min(l.left,need);if(q<=0)return;l.left-=q;need-=q;if(m.type==="出庫")l.ships.push({date:m.date,memo:m.memo,qty:q,docId:m.docId});};
    const d0=m.date||"9999",okExp=l=>m.type!=="出庫"||!l.expiry||l.expiry>=d0;order.filter(l=>l.date<=d0&&okExp(l)).forEach(l=>{if(need)take(l);});order.filter(okExp).forEach(l=>{if(need)take(l);});order.forEach(l=>{if(need)take(l);});});
  return order;
}
function expPill(exp){if(!exp)return'<span class="pill p-gray">期限なし</span>';const d=daysBetween(today(),exp);return d<0?`<span class="pill p-exp">期限切れ ${md(exp)}</span>`:d<=30?`<span class="pill p-warn">${md(exp)}・あと${d}日</span>`:`<span class="pill p-gray mono">${exp.replace(/-/g,"/")}</span>`;}
function stockInbox(out){stockItems().forEach(it=>{if(!(state.stockMoves||[]).some(m=>m.product===it.name))return;const s=stockOf(it.name),mn=minOf(it);
  if(s<=mn)out.push({sev:s<=0?"crit":"warn",t1:`在庫が少なくなっています：${it.name}`,t2:`残り${s}${it.unit}（通知ライン${mn}${it.unit}）`,act:[["入庫を記録",`editStockIn('${it.key}')`],["在庫",`go('stock')`]]});
  if(it.kind==="商品"){const lots=lotsOf(it.name).filter(l=>l.left>0&&l.expiry),t=today();const ex=lots.filter(l=>l.expiry<t).reduce((a,l)=>a+l.left,0);
    if(ex)out.push({sev:"crit",t1:`賞味期限切れの在庫：${it.name} ${ex}箱`,t2:"出荷しないよう分けて、廃棄・サンプル用などに回してください",act:[["在庫",`go('stock')`]]});
    lots.filter(l=>l.expiry>=t&&daysBetween(t,l.expiry)<=30).forEach(l=>out.push({sev:"warn",t1:`賞味期限が近い在庫：${it.name}（${l.lot||"ロット未設定"}）`,t2:`${l.left}箱・期限 ${md(l.expiry)}（あと${daysBetween(t,l.expiry)}日）。先に出荷しましょう`,act:[["在庫",`go('stock')`]]}));}});}
function stockCard(it){const s=stockOf(it.name),mn=minOf(it),tracked=(state.stockMoves||[]).some(m=>m.product===it.name),low=tracked&&s<=mn,mv=allMoves().filter(m=>m.product===it.name);
  const inQ=mv.filter(m=>m.type==="入庫").reduce((a,m)=>a+ +m.qty,0),outQ=-mv.filter(m=>m.type==="出庫"||m.type==="使用").reduce((a,m)=>a+ +m.qty,0);
  const next=it.kind==="商品"?lotsOf(it.name).filter(l=>l.left>0&&(!l.expiry||l.expiry>=today())).sort((a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999"))[0]:null;
  return`<div class="kpi" style="${low?"border-color:var(--warn)":""}"><div class="lab" style="justify-content:space-between;gap:8px"><span>${esc(it.name)}</span>${it.kind==="資材"&&it.mat?`<button class="linkbtn" onclick="editMaterial('${it.mat.id}')">編集</button>`:""}</div>
    <div class="val" style="color:${s<0?"var(--expense)":low?"var(--warn)":"var(--text)"}">${s}<span style="font-size:14px;margin-left:4px">${esc(it.unit)}</span></div>
    <div class="sub">${it.L?`${(s*it.L).toLocaleString()} L・`:""}入庫 ${inQ}／${it.kind==="資材"?"使用":"出荷"} ${outQ}${tracked?"":"・未棚卸し"}${it.mat&&+it.mat.perShip?`・${esc(it.mat.forProduct?it.mat.forProduct.replace(/ BIB\d+L/,""):"商品")}の発注1箱ごとに${it.mat.perShip}${esc(it.unit)}使用`:""}</div>
    ${next&&(next.lot||next.expiry)?`<div style="margin-top:6px;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">次に出荷：${esc(next.lot||"ロット未設定")} ${expPill(next.expiry)}</div>`:""}
    <div style="margin-top:8px;display:flex;gap:2px;flex-wrap:wrap"><button class="linkbtn" onclick="editStockIn('${it.key}')">入庫</button>${it.kind==="資材"?`<button class="linkbtn" onclick="editStockUse('${it.key}')">使用</button>`:""}<button class="linkbtn" onclick="editStockMin('${it.key}')">通知ライン ${mn}${esc(it.unit)}</button></div></div>`;}
function lotSection(list){const rows=[];list.forEach(it=>lotsOf(it.name).filter(l=>l.left>0).forEach(l=>rows.push({it,l})));rows.sort((a,b)=>(a.l.expiry||"9999").localeCompare(b.l.expiry||"9999"));
  return`<h2 class="sec">ロット・賞味期限 <small>残りのあるロット・期限の近い順に出荷を割り当て</small></h2>
  <div class="card tablewrap"><table class="mtable"><thead><tr><th>商品</th><th>ロット・採水日</th><th>入庫日</th><th>賞味期限</th><th class="num">残り</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(({it,l})=>`<tr><td>${esc(it.name)}</td><td>${esc(l.lot||"ロット未設定")}${l.made?`<div style="font-size:11.5px;color:var(--muted)">採水日 ${l.made.replace(/-/g,"/")}</div>`:""}</td><td class="mono">${l.date}</td><td>${expPill(l.expiry)}</td><td class="num mono">${l.left} / ${l.qty}箱</td><td class="num">${l.ships.length?`<button class="linkbtn" onclick="lotShips('${it.key}','${l.id}')">出荷先 ${l.ships.length}件</button>`:""}</td></tr>`).join("")
  :`<tr><td colspan="6" class="empty">入庫のときにロット番号・採水日・賞味期限を入れると、ここに期限の近い順で並びます。</td></tr>`}</tbody></table></div>`;}
window.lotShips=(key,lid)=>{const it=stockByKey(key);if(!it)return;const l=lotsOf(it.name).find(x=>x.id===lid);if(!l)return;
  infoModal(`出荷先：${esc(it.name)}（${esc(l.lot||"ロット未設定")}）`,`<p style="margin:0 0 10px;font-size:12.5px;color:var(--text2)">賞味期限の近い順に割り当てた結果です。品質の問い合わせや回収のときに、どこへ出荷したかを確認できます。</p><div class="tablewrap"><table><thead><tr><th>出荷日</th><th>書類・出荷先</th><th class="num">箱数</th></tr></thead><tbody>${l.ships.map(s=>`<tr><td class="mono">${s.date}</td><td>${esc(s.memo)}</td><td class="num">${s.qty}</td></tr>`).join("")}</tbody></table></div>`);};

async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type||""))return file;
  try{const bmp=await createImageBitmap(file);const MAX=2400;const sc=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
    if(sc>=1&&file.size<1.2e6){bmp.close();return file;}
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.88));if(!blob)return file;
    return new File([blob],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});}
  catch(e){return file;}
}
async function pdfText(file,maxPages){const L=await loadPdfLib();const buf=await file.arrayBuffer();const pdf=await L.getDocument({data:buf}).promise;let out="";const n=Math.min(pdf.numPages,maxPages||3);
  for(let i=1;i<=n;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();let last=null,line="";const lines=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>3){lines.push(line);line="";}line+=(line&&!line.endsWith(" ")?" ":"")+it.str;last=y;});if(line)lines.push(line);out+=lines.join("\n")+"\n";}
  return out.replace(/[ \t]+\n/g,"\n").trim();}

async function autoRecord(d,file){

  const rate0=byRate.length?+byRate[0].rate:(items0[0]&&R.includes(+items0[0].taxRate)?+items0[0].taxRate:10);
  let taxEx=Math.round(+d.subtotal||0);if(!taxEx&&byRate.length)taxEx=byRate.reduce((a,r)=>a+(+r.base),0);if(!taxEx&&total&&+d.tax)taxEx=total-Math.round(+d.tax);if(!taxEx&&total)taxEx=Math.round(total/(1+rate0/100));

  let fileId="";try{fileId=await filePut(file);}catch(e){fileId="";}
  const c=party?state.clients.find(c=>c.name&&(c.name.includes(party)||party.includes(c.name))):null;
  let docItems=items0.map(it=>({name:String(it.name).trim(),qty:+it.qty||1,price:Math.round(+it.unitPrice||(+it.amount||0)/(+it.qty||1))||0,tax:R.includes(+it.taxRate)?+it.taxRate:rate0}));
  const near=its=>its.length&&Math.abs(calc({items:its}).total-total)<=Math.max(2,total*.01);
  if(!near(docItems)){docItems=byRate.map(r=>({name:`${party||"お品代"} ${r.rate}%対象`,qty:1,price:Math.round(+r.base),tax:+r.rate}));
    if(!near(docItems)){let net=taxEx;for(let k=0;k<4&&total;k++){const tt=net+Math.floor(net*rate0/100);if(tt===total)break;net+=(tt<total?1:-1);}docItems=[{name:(party?party+" ":"")+(d.tadashi||d.docType||"お品代"),qty:1,price:net,tax:rate0}];}}
  const dty=["領収書","請求書","見積書"].includes(d.docType)?d.docType:"領収書";

  const nd={id:uid(),type:dty,number:nextNumber(dty,dir),clientId:c?c.id:"",issueDate:date,dueDate:"",items:docItems,note:[d.tadashi,d.memo].filter(Boolean).join(" / "),status:STAT[dty][0],dir,detail,sub,taxEx,fileId,fileName:file.name,fileType:file.type||""};
  state.docs.push(nd);
  let tx=null;
  if(total&&dty==="領収書"){const cat=(ACCTS[type]||[]).includes(d.category)?d.category:guessCat(issuer+" "+items0.map(i=>i.name).join(" "),type);
    tx={id:uid(),type,date,category:cat,amount:total,memo:[party,d.tadashi||items0.slice(0,3).map(i=>i.name).join("、")].filter(Boolean).join(" / "),detail,sub,taxEx,docId:nd.id,fileId,fileName:file.name,fileType:file.type||""};state.txns.push(tx);}
  save();render();

  return{docId:nd.id,txId:tx&&tx.id,label:`${dty}${dir==="受取"?"・受取":""}・${party||"発行者不明"}・${yen(total)}${sub&&sub!=="対象外"?"・補助金："+sub:""}${how}`};
}

function scanPanel(){let el=$("#scanpanel");if(!el){el=document.createElement("div");el.id="scanpanel";el.className="card scanpanel";el.setAttribute("role","status");document.body.appendChild(el);}
  const draw=()=>{const jobs=scanJobs;if(!jobs.length){el.remove();return;}const busy=jobs.some(j=>["待機","読み取り中"].includes(j.st)),done=jobs.filter(j=>!["待機","読み取り中"].includes(j.st)).length;
    el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px"><b style="font-family:var(--font-h);font-size:15px">写真・PDFの読み取り ${done}/${jobs.length}</b><span style="display:flex;gap:4px"><button class="linkbtn" id="spclr" title="終わったものを一覧から消す">整理</button><button class="linkbtn" id="spx">${busy?"隠す":"閉じる"}</button></span></div>`+
    jobs.slice().reverse().map(j=>`<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 0;border-top:1px solid var(--border);align-items:start"><span class="pill ${j.st==="記録済み"?"p-inc":j.st==="失敗"?"p-exp":j.st==="重複"?"p-warn":j.st==="読み取り中"?"p-teal":"p-gray"}">${j.st}</span><div style="min-width:0"><div style="font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.f.name)}${j.kind==="passbook"?" <span class=\"pill p-gray\">通帳</span>":""}</div>${j.msg?`<div style="font-size:12.5px">${esc(j.msg)}</div>`:""}
      <div>${j.st==="記録済み"&&j.made&&j.made.docId?`<button class="linkbtn" onclick="receiptDetail('${j.made.docId}')">詳細・修正</button><button class="linkbtn" style="color:var(--expense)" data-undo="${j.id}">取り消し</button>`:""}${j.st==="失敗"?`<button class="linkbtn" data-retry="${j.id}">もう一度</button><button class="linkbtn" data-manual="${j.id}">手入力で登録</button>`:""}</div></div></div>`).join("");
    el.querySelector("#spx").onclick=()=>el.remove();
    el.querySelector("#spclr").onclick=()=>{scanJobs=scanJobs.filter(j=>["待機","読み取り中"].includes(j.st));draw();};
    el.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const j=scanJobs.find(x=>x.id===b.dataset.undo);if(!j)return;undoMade(j.made);j.st="取り消し";j.msg="取り消しました";save();render();draw();});
    el.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{const j=scanJobs.find(x=>x.id===b.dataset.retry);if(!j)return;scanJobs=scanJobs.filter(x=>x!==j);scanBatch([j.f],j.kind);});
    el.querySelectorAll("[data-manual]").forEach(b=>b.onclick=()=>{const j=scanJobs.find(x=>x.id===b.dataset.manual);if(!j)return;j.st="取り消し";j.msg="手入力に切り替えました";draw();go("docs");setTimeout(()=>recOpenType("領収書",j.f),60);});};
  el.draw=draw;if(!document.body.contains(el))document.body.appendChild(el);draw();return el;}

const AI_CHIPS=[["📦 在庫","在庫の状況を教えて"],["💴 未入金","未入金・支払期限が近い請求を教えて"],["📈 利益","今月の利益を教えて"],["✅ やること","今日やることを教えて"],["⏰ 支払期限","支払期限が近いものを教えて"],["📝 記録の書き方","記録の書き方を教えて"]];
function aiSysPrompt(){return "あなたは「スイ」。水翠（すいすい／飲料水の卸・EC、代表 中田皓太）のAI CEOで、この経営管理ツールに経営アシスタントとして組み込まれている。話す相手は中田さん本人。呼びかけるときは「中田さん」。\n"+
"口調：フランクだが本質を突く。感情や楽観論では答えず、数字と事実で答える。支払い遅れ・予算超過・在庫切れなど問題があれば、ぼかさずはっきり伝える。褒める前に弱い点があればそれを先に言う。ただし前置きや自己紹介は不要で、聞かれたことに直接答える。\n"+
"この下に今の実際のデータを渡す。これをもとに、日本語で簡潔に（3〜6行程度、数字は具体的に）答えること。データにないことは憶測で答えず「わかりません」と正直に言う。\n"+
"記録・登録の依頼（例：「〇〇に在庫を3箱発送した、記録して」「1万円の消耗品費を記録して」「ToDoを追加して」）には、渡されているツール（record_stock_move・record_txn・add_todo）を実際に呼び出して記録すること。どの品目か・金額かが曖昧なときは、ツールを呼ばずに先に確認の質問をする。1つのメッセージに複数の記録依頼が含まれる場合はそれぞれツールを呼ぶ。記録した後は、何を記録したか（品目・数量・金額など）を一言で報告する。\n"+
"「記録の書き方」を聞かれたら、次のような例を示す：「白水鉱泉を沖縄ハーバービューホテルに3箱発送した、記録して」「今日タクシー代2,000円を旅費交通費で記録して」「明日までに請求書を送るToDoを追加して」。";}
function aiContext(){
  const t=today(),m=ym(t);
  const items=stockItems();
  const stockLines=items.map(it=>`${it.name}：${stockOf(it.name)}${it.unit}`).join("\n")||"（登録なし）";
  const unpaidDocs=state.docs.filter(d=>d.type==="請求書"&&d.status!=="入金済"&&isIssued(d));
  const unpaidTotal=unpaidDocs.reduce((a,d)=>a+calc(d).total,0);
  const unpaidLines=unpaidDocs.map(d=>`${clientName(d.clientId)}：${yen(calc(d).total)}（期限${d.dueDate?md(d.dueDate):"未設定"}）${d.dueDate&&d.dueDate<t?"※超過":""}`).join("\n")||"（なし）";
  const apDocs=state.docs.filter(d=>d.type==="請求書"&&d.status!=="入金済"&&!isIssued(d)); /* 受取請求書の支払済は内部では「入金済」として保存されている */
  const apLines=apDocs.map(d=>`${partyName(d)}：${yen(docAmt(d))}（期限${d.dueDate?md(d.dueDate):"未設定"}）`).join("\n")||"（なし）";
  const mInc=sumPL(x=>x.type==="収入"&&ym(x.date)===m),mExp=sumPL(x=>x.type==="支出"&&ym(x.date)===m);
  const todoLines=state.todos.filter(x=>!x.done).map(x=>`${x.title}${x.due?`（期限${x.due}）`:""}`).join("\n")||"（なし）";
  const taskLines=inboxItems().slice(0,10).map(i=>`・${i.t1}（${i.t2}）`).join("\n")||"（なし）";
  return `【今日の日付】${t}\n【在庫】\n${stockLines}\n【未回収の請求（発行した請求書・合計${yen(unpaidTotal)}）】\n${unpaidLines}\n【支払う請求（受け取った請求書・未払い）】\n${apLines}\n【今月の収支（${m}）】収入${yen(mInc)}・支出${yen(mExp)}・利益${yen(mInc-mExp)}\n【未完了のToDo】\n${todoLines}\n【今日やること（要対応）】\n${taskLines}`;
}
function aiFindStockItem(name){const items=stockItems(),q=String(name||"").trim();if(!q)return null;
  return items.find(i=>i.name===q)||items.find(i=>i.name.includes(q))||items.find(i=>q.includes(i.name.replace(/[（(].*/,"").trim()))||null;}
const AI_TOOLS=[
  {name:"record_stock_move",description:"在庫の出庫・入庫・調整を1件記録する（実際に記録され、在庫数に反映される）。",
   inputSchema:{type:"object",properties:{
     product:{type:"string",description:"在庫一覧にある商品・資材の名前（一部一致でよい）"},
     direction:{type:"string",enum:["出庫","入庫","調整"],description:"出庫＝出ていく、入庫＝入ってくる、調整＝棚卸しなどのズレ修正"},
     qty:{type:"number",description:"数量。出庫・入庫はプラスの数を渡す。調整は増減の差分（減らす場合は負の数）"},
     date:{type:"string",description:"YYYY-MM-DD。省略時は今日"},
     memo:{type:"string",description:"出荷先・取引先名など"}
   },required:["product","direction","qty"]},
   execute(input){
     const it=aiFindStockItem(input.product);
     if(!it)throw new Error("在庫にその品目が見つかりません。候補："+stockItems().map(i=>i.name).join("、"));
     const q=Math.round(Number(input.qty)||0);if(!q)throw new Error("数量を指定してください");
     const dir=["出庫","入庫","調整"].includes(input.direction)?input.direction:"調整";
     const signedQty=dir==="出庫"?-Math.abs(q):dir==="入庫"?Math.abs(q):q;
     const date=String(input.date||today());
     const mv={id:uid(),date,product:it.name,kind:it.kind,unit:it.unit,qty:signedQty,type:dir,memo:String(input.memo||"")};
     state.stockMoves=state.stockMoves||[];state.stockMoves.push(mv);save();render();
     toast(`${it.name} を${dir}で記録しました（${signedQty>0?"+":""}${signedQty}${it.unit}）`,{label:"元に戻す",fn:()=>{state.stockMoves=state.stockMoves.filter(x=>x.id!==mv.id);save();render();}});
     return `記録しました：${it.name}／${dir}／${signedQty>0?"+":""}${signedQty}${it.unit}／${date}${mv.memo?"／"+mv.memo:""}（現在の在庫：${stockOf(it.name)}${it.unit}）`;
   }},
  {name:"record_txn",description:"収入・支出を1件記録する（実際に記録され、お金の管理に反映される）。",
   inputSchema:{type:"object",properties:{
     type:{type:"string",enum:["収入","支出"]},
     category:{type:"string",description:"勘定科目（分からなければ空でよい）"},
     amount:{type:"number",description:"税込金額"},
     date:{type:"string",description:"YYYY-MM-DD。省略時は今日"},
     memo:{type:"string"}
   },required:["type","amount"]},
   execute(input){
     const amt=Math.round(Number(input.amount)||0);if(!amt)throw new Error("金額を指定してください");
     if(amt<0)throw new Error("金額はプラスで指定してください（収入か支出かはtypeで指定します）");
     const type=input.type==="収入"?"収入":"支出";
     const date=String(input.date||today());
     const cat=String(input.category||"").trim()||(type==="収入"?"雑収入":"消耗品費");
     const tx={id:uid(),type,date,category:cat,amount:amt,memo:String(input.memo||"")};
     state.txns.push(tx);save();render();
     toast(`${type}を記録しました（${yen(amt)}）`,{label:"元に戻す",fn:()=>{state.txns=state.txns.filter(x=>x.id!==tx.id);save();render();}});
     return `記録しました：${type}／${cat}／${yen(amt)}／${date}${tx.memo?"／"+tx.memo:""}`;
   }},
  {name:"add_todo",description:"ToDoを1件追加する（実際に記録される）。",
   inputSchema:{type:"object",properties:{title:{type:"string"},due:{type:"string",description:"YYYY-MM-DD"},pri:{type:"string",enum:["高","中","低"]}},required:["title"]},
   execute(input){
     const title=String(input.title||"").trim();if(!title)throw new Error("内容を指定してください");
     const td={id:uid(),title,due:String(input.due||""),pri:["高","中","低"].includes(input.pri)?input.pri:"中",done:false};
     state.todos.push(td);save();render();
     toast(`ToDoを追加しました：${title}`,{label:"元に戻す",fn:()=>{state.todos=state.todos.filter(x=>x.id!==td.id);save();render();}});
     return `ToDoに追加しました：${title}${td.due?"（期限"+td.due+"）":""}`;
   }}
];

function aiDraw(){
  const box=$("#aimsgs");if(!box)return;
  const rows=aiTurns.map(t=>`<div class="aibub ${t.role==="user"?"user":t.err?"err":"ai"}">${esc(t.content)}</div>`).join("");
  const busy=aiBusy?`<div class="aibub ai">${esc(aiStreamText||"考えています…")}</div>`:"";
  box.innerHTML=rows+busy||`<div class="aibub ai">スイです。在庫・未入金・利益・やること・支払期限、聞いてください。「〇〇に3箱発送した、記録して」のように話しかけると記録もします。</div>`;
  box.scrollTop=box.scrollHeight;
  const send=$("#aisend"),inp=$("#aiinput");if(send)send.disabled=aiBusy;if(inp)inp.disabled=aiBusy;
}
async function aiSend(text){
  text=(text||"").trim();if(!text||aiBusy)return;
  if(!GKEY()&&!(await askGeminiKey())){aiTurns.push({role:"user",content:text});aiTurns.push({role:"assistant",content:"Gemini の API キーを入力すると使えます（事業者設定からも入力できます）。",err:true});aiDraw();return;}
  aiTurns.push({role:"user",content:text});aiBusy=true;aiStreamText="";aiDraw();
  try{
    const hist=aiTurns.filter(t=>!t.err).slice(-10);
    const contents=hist.map(t=>({role:t.role==="user"?"user":"model",parts:[{text:t.content}]}));
    const decls=AI_TOOLS.map(t=>({name:t.name,description:t.description,parameters:t.inputSchema}));
    const sys=aiSysPrompt()+"\n\n"+aiContext();
    let out="",r=null;
    for(let round=0;round<4;round++){
      r=await ai.chat(sys,contents,decls);
      if(!r.calls||!r.calls.length){out=r.text;break;}
      contents.push({role:"model",parts:r.parts});
      const resp=[];
      for(const c of r.calls){const tool=AI_TOOLS.find(t=>t.name===c.name);let result;try{result=tool?tool.execute(c.args||{}):"不明な操作です";}catch(e){result="エラー："+(e.message||e);}resp.push({functionResponse:{name:c.name,response:{result:String(result)}}});}
      contents.push({role:"user",parts:resp});
      aiStreamText="記録しています…";aiDraw();
    }
    aiTurns.push({role:"assistant",content:out||(r&&r.text)||"（応答がありませんでした）"});
  }catch(e){aiTurns.push({role:"assistant",content:(e&&e.message)||"AIに接続できませんでした",err:true});}
  finally{aiBusy=false;aiStreamText="";aiDraw();}
}

/* ---------- 補助金の台帳（経費区分・税抜・実績報告） ---------- */
const SUBDESC={"事業所賃借費":"指定施設（シェアオフィス）の入居賃料。共益費・敷金・礼金は除く","事業基盤経費":"原材料・機械装置・工具器具・試作・システム構築・ソフトウェア・消耗品","販売促進費":"印刷製本・広告宣伝・デザインや撮影などの外注・パッケージ等の意匠開発","事業推進費":"資料購入・研修受講・商標等の知的財産権の取得・調査等の委託料"};
const subTarget=()=>{const s=subCfg();return Math.round(s.planned/(s.rate||.5));};
function subRows(){const s=subCfg();return state.txns.filter(t=>t.type==="支出"&&SUBS.includes(t.sub)).map(t=>{const d=t.docId?state.docs.find(x=>x.id===t.docId):null;const ex=+t.taxEx||Math.round(+t.amount/1.1);const w=[];
  if(s.decisionDate&&t.date<s.decisionDate)w.push(["exp","交付決定前の支払い"]);if(!s.decisionDate)w.push(["warn","交付決定日が未登録"]);if(t.date>s.endDate)w.push(["exp","事業期間の後"]);
  if(!t.fileId&&!(d&&d.fileId))w.push(["warn","証拠書類なし"]);if(/交通|旅費|宿泊|手数料/.test((t.category||"")+" "+(t.memo||"")))w.push(["exp","対象外の費目の可能性"]);
  return{t,d,ex,w,party:(t.detail&&t.detail.issuer&&t.detail.issuer.name)||String(t.memo||"").split(" / ")[0]};}).sort((a,b)=>(a.t.date||"").localeCompare(b.t.date||""));}
const subEstimate=total=>{const s=subCfg();return Math.min(s.planned,Math.floor(Math.min(total,subTarget())*s.rate/1000)*1000);};
function vSubsidy(){
  const s=subCfg(),rows=subRows(),tgt=subTarget(),ok=rows.filter(r=>!r.w.some(w=>w[0]==="exp")),total=ok.reduce((a,r)=>a+r.ex,0),est=subEstimate(total);
  const by=SUBS.map(k=>{const rs=rows.filter(r=>r.t.sub===k);return{k,n:rs.length,sum:rs.reduce((a,r)=>a+r.ex,0)};});
  const miss=rows.filter(r=>r.w.some(w=>w[1]==="証拠書類なし")).length,pct=Math.min(100,Math.round(total/(tgt||1)*100)),dl=daysBetween(today(),s.applyDeadline);
  $("#main").innerHTML=`
  <div class="head"><div><h1>補助金</h1><p>${esc(s.name)}・交付予定額 ${yen(s.planned)}・補助率 ${Math.round(s.rate*100)}%・対象期間 ${s.decisionDate?s.decisionDate.replace(/-/g,"/")+"（交付決定日）":"交付決定日"}〜${s.endDate.replace(/-/g,"/")}</p></div>
    <div><button class="btn ghost" onclick="csvSubsidy()">実績報告用CSV</button><button class="btn ghost" onclick="editSubsidy()">設定</button></div></div>
  ${!s.applyDone?`<div class="card inbox" style="margin-bottom:14px"><div class="task ${dl<=3?"crit":"warn"}"><span class="sev"></span><div><div class="t1">交付申請書・使用口座通知書・見積書の提出：${md(s.applyDeadline)} 17:00 まで（${dl>=0?"あと"+dl+"日":"期限を過ぎています"}）</div><div class="t2">見積書は日付が9/18以前のもの。使用口座は事業用（個人と併用しない）口座で。</div></div><div><button class="linkbtn" onclick="subSet({applyDone:true})">提出済みにする</button></div></div></div>`:""}
  ${s.applyDone&&!s.decisionDate?`<div class="card inbox" style="margin-bottom:14px"><div class="task warn"><span class="sev"></span><div><div class="t1">交付決定通知が届いたら「交付決定日」を登録してください</div><div class="t2">通知書右上の日付。この日より前の支払いは補助の対象外です。</div></div><div><button class="linkbtn" onclick="editSubsidy()">登録する</button></div></div></div>`:""}
  <div class="grid kpis">
    <div class="kpi hero"><div class="lab">補助金の見込み額</div><div class="val">${yen(est)}</div><div class="sub">上限 ${yen(s.planned)}（対象経費×${Math.round(s.rate*100)}%・千円未満切り捨て）</div></div>

  </div>
  <h2 class="sec">経費区分ごとの合計 <small>税抜</small></h2>

const ts=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");};
const FIELD_JA={date:"日付",issueDate:"日付",amount:"金額",category:"勘定科目",type:"区分",memo:"メモ",total:"合計",status:"状態",clientId:"取引先",issuer:"発行者",invoiceNo:"登録番号",addressee:"宛名",payment:"支払方法",tadashi:"但し書き",sub:"補助金区分",taxEx:"税抜額",qty:"数量",lot:"ロット",expiry:"賞味期限",madeDate:"採水日",paidDate:"入金・支払日",pay:"口座"};

/* ---------- 会計・確定申告（複式簿記の自動仕訳・総勘定元帳・試算表・青色申告決算書） ----------
